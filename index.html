    const particles = [];
    function burst(position, color = 0x9bf2df, count = 18, speed = 3) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .98, blending: THREE.AdditiveBlending, depthWrite: false });
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(.045 + Math.random() * .075, 10, 8), mat);
        mesh.position.copy(position); scene.add(mesh);
        const velocity = new THREE.Vector3((Math.random() - .5) * speed, Math.random() * speed, (Math.random() - .5) * speed);
        particles.push({ mesh, velocity, life: .45 + Math.random() * .55, max: .95 });
      }
    }
    const slashGroup = new THREE.Group(); scene.add(slashGroup);
    function slashEffect(isSkill) {
      const color = isSkill ? 0x9df6e3 : 0xe5d5a5;
      const arc = new THREE.Mesh(new THREE.TorusGeometry(isSkill ? 2.5 : 1.65, .075, 12, 128, Math.PI * 1.3), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .98, blending: THREE.AdditiveBlending, depthWrite: false }));
      arc.position.copy(player.position).add(new THREE.Vector3(0, 1.05, 0)); arc.rotation.x = Math.PI / 2; arc.rotation.z = Math.random() * Math.PI; slashGroup.add(arc);
      particles.push({ mesh: arc, velocity: new THREE.Vector3(0, .5, 0), life: .36, max: .36, remove: true });
    }

    const state = { phase: 'intro', dialogue: 0, health: 100, hits: 0, skillReady: true, attackReady: true, time: 0, toastTimer: 0, ending: false };
    const lines = [
      ['守城兵', '城主！西边的雾里全是幽灵，城门快守不住了！'],
      ['城主', '全城戒备！老夫既已归来，便不会让它们踏进半步。'],
      ['你', '城主，先退到灯阵之内。这些东西，我来拦住。'],
      ['守城兵', '它们怕光！剑客大人，灯阵周围交给你了！'],
      ['城主', '小心……幽灵身上缠着一股不属于此世的剑意。']
    ];
    const el = (id) => document.getElementById(id);
    const dialogueEl = el('dialogue');
    function showLine() {
      if (state.dialogue >= lines.length) { beginBattle(); return; }
      el('speaker').textContent = lines[state.dialogue][0];
      el('line').textContent = lines[state.dialogue][1];
      dialogueEl.classList.add('show');
    }
    function advanceDialogue() { if (state.phase !== 'dialogue') return; state.dialogue++; showLine(); }
    dialogueEl.addEventListener('click', advanceDialogue);
    function beginBattle() {
      state.phase = 'battle'; dialogueEl.classList.remove('show');
      el('intro').classList.remove('show'); el('objective').classList.add('show'); el('health').classList.add('show'); el('controls').classList.add('show');
      player.visible = true; player.position.set(-1.3, 0, 2.5);
      player.rotation.y = Math.PI;
      ghosts.forEach(g => { g.visible = true; });
      villagers.forEach((v, i) => { v.visible = true; v.position.x = -2.6 + i * 1.2; v.position.z = -3.7; });
      el('objectiveText').textContent = '护住城主，击退幽灵';
      updateEnemyCount();
      toast('幽灵来袭！靠近后挥剑，剑气可同时击中多个目标');
    }
    function updateEnemyCount() {
      const remaining = ghosts.filter(g => g.userData.alive).length;
      el('enemyCount').textContent = `幽灵 ${3 - remaining} / 3`;
      if (!remaining && state.phase === 'battle') finishBattle();
    }
    function finishBattle() {
      state.phase = 'ending'; el('objectiveText').textContent = '幽灵已退，城门异动';
      toast('最后一道剑意，竟与你的招式一模一样……');
      setTimeout(() => { if (state.phase === 'ending') el('chapterEnd').classList.add('show'); }, 1900);
    }
    function toast(text) {
      el('toast').textContent = text; el('toast').classList.add('show'); state.toastTimer = 2.7;
    }
    el('begin').addEventListener('click', () => {
      el('begin').classList.remove('show'); state.phase = 'landing'; state.time = 0;
      el('intro').classList.remove('show');
    });
    el('chapterEnd').addEventListener('click', () => {
      if (state.phase !== 'ending') return;
      el('chapterEnd').classList.remove('show'); toast('未完待续');
    });

    const keys = new Set();
    addEventListener('keydown', (event) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if (event.code === 'Space' && state.phase === 'battle') attack(false);
      if ((event.code === 'KeyE' || event.code === 'ShiftLeft') && state.phase === 'battle') attack(true);
      if (event.code === 'Enter' && state.phase === 'dialogue') advanceDialogue();
    });
    addEventListener('keyup', e => keys.delete(e.code));
    const move = new THREE.Vector2();
    const stick = el('stick'), knob = el('knob');
    let stickPointer = null;
    function setStick(e) {
      const r = stick.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const max = r.width * .34, len = Math.min(max, Math.hypot(dx, dy)), angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * len, y = Math.sin(angle) * len;
      knob.style.transform = `translate(${x}px, ${y}px)`;
      move.set(x / max, -y / max);
    }
    stick.addEventListener('pointerdown', e => { stickPointer = e.pointerId; stick.setPointerCapture(e.pointerId); setStick(e); });
    stick.addEventListener('pointermove', e => { if (e.pointerId === stickPointer) setStick(e); });
    const releaseStick = e => { if (e.pointerId !== stickPointer) return; stickPointer = null; move.set(0, 0); knob.style.transform = 'translate(0, 0)'; };
    stick.addEventListener('pointerup', releaseStick); stick.addEventListener('pointercancel', releaseStick);
    el('attack').addEventListener('click', () => attack(false));
    el('skill').addEventListener('click', () => attack(true));

    function attack(skill) {
      if (state.phase !== 'battle') return;
      if (skill && !state.skillReady) { toast('剑气尚未凝成'); return; }
      if (!skill && !state.attackReady) return;
      if (skill) { state.skillReady = false; el('skill').style.filter = 'grayscale(1) brightness(.65)'; setTimeout(() => { state.skillReady = true; el('skill').style.filter = ''; }, 4300); }
      else { state.attackReady = false; setTimeout(() => state.attackReady = true, 430); }
      state.attackSwing = 1;
      slashEffect(skill);
      const reach = skill ? 5.8 : 3.05;
      let struck = 0;
      for (const ghost of ghosts) {
        if (!ghost.userData.alive) continue;
        const dist = player.position.distanceTo(ghost.position);
        if (dist > reach) continue;
        const direction = ghost.position.clone().sub(player.position).normalize();
        const facing = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        if (!skill && facing.dot(direction) < -.32) continue;
        ghost.userData.hp -= skill ? 2 : 1; struck++;
        burst(ghost.position.clone().add(new THREE.Vector3(0, 1.1, 0)), skill ? 0xa5fff0 : 0xd9e7bd, skill ? 95 : 42, skill ? 5.8 : 3.4);
        ghost.position.addScaledVector(direction, skill ? 1.35 : .65);
        ghost.rotation.y += Math.PI * .6;
        if (ghost.userData.hp <= 0) {
          ghost.userData.alive = false; ghost.visible = false;
          burst(ghost.position.clone().add(new THREE.Vector3(0, .9, 0)), 0x85eee1, 150, 6.2);
        }
      }
      if (struck) { state.hits += struck; toast(skill ? `剑气扫中 ${struck} 个幽灵！` : '一剑命中！'); }
      else if (skill) toast('剑气划破夜雾，幽灵还在更近处……');
      updateEnemyCount();
    }

    function updatePlayer(dt) {
      let x = move.x, z = move.y;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
      if (keys.has('KeyW') || keys.has('ArrowUp')) z -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) z += 1;
      const vec = new THREE.Vector2(x, z);
      if (vec.lengthSq() > 1) vec.normalize();
      player.position.x = THREE.MathUtils.clamp(player.position.x + vec.x * 5.2 * dt, -13, 13);
      player.position.z = THREE.MathUtils.clamp(player.position.z + vec.y * 5.2 * dt, -25, 7);
      if (vec.lengthSq() > .005) player.rotation.y = Math.atan2(vec.x, vec.y);
      player.position.y = Math.abs(Math.sin(state.time * 8)) * (vec.lengthSq() > .03 ? .06 : .025);
      const walking = Math.min(vec.length(), 1);
      state.attackSwing = Math.max(0, (state.attackSwing || 0) - dt * 3.8);
      for (const arm of player.userData.arms) arm.mesh.rotation.z = arm.rest + arm.side * (walking * Math.sin(state.time * 9) * .42) - (arm.side > 0 ? state.attackSwing * 1.55 : 0);
      for (const leg of player.userData.legs) leg.mesh.rotation.x = walking * Math.sin(state.time * 9 + (leg.side > 0 ? Math.PI : 0)) * .42;
      riderSword.rotation.z = -.85 + (walking ? Math.sin(state.time * 11) * .28 : 0) + state.attackSwing * 1.5;
    }
    function updateGhosts(dt) {
      for (const ghost of ghosts) {
        const data = ghost.userData; if (!data.alive) continue;
        data.phase += dt * 2.2;
        ghost.position.y = .15 + Math.sin(data.phase) * .22;
        for (let i = 0; i < data.tatters.length; i++) {
          data.tatters[i].rotation.z = Math.sin(data.phase * 1.4 + i * 1.7) * .22;
          data.tatters[i].rotation.x = Math.cos(data.phase + i) * .16;
        }
        const dx = player.position.x - ghost.position.x, dz = player.position.z - ghost.position.z, dist = Math.hypot(dx, dz);
        if (dist > 1.45) {
          ghost.position.x += dx / dist * data.speed * dt;
          ghost.position.z += dz / dist * data.speed * dt;
          ghost.rotation.y = Math.atan2(dx, dz);
        } else {
          data.attackCooldown -= dt;
          if (data.attackCooldown <= 0) {
            data.attackCooldown = 1.45;
            state.health = Math.max(0, state.health - 8);
            el('healthFill').style.width = `${state.health}%`;
            el('healthText').textContent = `${state.health} / 100`;
            burst(player.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xf18a71, 8, 1.5);
            toast('被幽灵击中！走位躲开它们的爪子');
            if (state.health <= 0) {
              state.health = 60; el('healthFill').style.width = '60%'; el('healthText').textContent = '60 / 100';
              player.position.set(-1.3, 0, 2.5); toast('侠心未灭！借灯阵之力重新站起');
            }
          }
        }
      }
    }
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life -= dt; p.mesh.position.addScaledVector(p.velocity, dt); p.velocity.y -= dt * 2;
        if (p.mesh.material) p.mesh.material.opacity = Math.max(0, p.life / p.max);
        if (p.life <= 0) { scene.remove(p.mesh); p.mesh.geometry.dispose(); if (p.remove && p.mesh.material) p.mesh.material.dispose(); particles.splice(i, 1); }
      }
    }
    const camTarget = new THREE.Vector3();
    function updateCamera(dt) {
      let desired;
      if (state.phase === 'intro' || state.phase === 'landing') desired = new THREE.Vector3(0, 6.5, 13);
      else desired = new THREE.Vector3(player.position.x * .58, 7.4, player.position.z + 12.6);
      camera.position.lerp(desired, 1 - Math.exp(-dt * 2.6));
      const look = state.phase === 'intro' || state.phase === 'landing' ? new THREE.Vector3(0, 1.2, -11) : new THREE.Vector3(player.position.x * .42, 1.1, player.position.z - 5);
      camTarget.lerp(look, 1 - Math.exp(-dt * 3.2)); camera.lookAt(camTarget);
    }
    function updateLanding(dt) {
      state.time += dt;
      swordRide.position.y = Math.max(.8, 8 - state.time * 2.4);
      swordRide.position.z = 14 - Math.min(state.time * 3.7, 16);
      swordRide.rotation.z = Math.sin(state.time * 1.8) * .045;
      swordRide.rotation.x = Math.sin(state.time * 1.5) * .025;
      if (state.time > 2.4 && !swordRide.userData.landed) {
        swordRide.userData.landed = true;
        burst(new THREE.Vector3(0, .3, -1.7), 0xd4e7c2, 30, 3.3);
        villagers.forEach(v => v.visible = true);
      }
      if (state.time > 3.1 && !state.dialogueStarted) {
        state.dialogueStarted = true; swordRide.visible = false;
        player.position.set(-1.3, 0, 2.5); player.visible = true;
        state.phase = 'dialogue'; showLine();
      }
    }
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .04); state.time += state.phase === 'battle' ? dt : 0;
      if (state.phase === 'landing') updateLanding(dt);
      if (state.phase === 'battle') { updatePlayer(dt); updateGhosts(dt); }
      if (state.phase === 'battle' || state.phase === 'ending') {
        const remaining = ghosts.filter(g => g.userData.alive).length;
        el('enemyCount').textContent = `幽灵 ${3 - remaining} / 3`;
      }
      if (state.toastTimer > 0) { state.toastTimer -= dt; if (state.toastTimer <= 0) el('toast').classList.remove('show'); }
      updateParticles(dt); updateCamera(dt);
      const emberAttribute = emberGeometry.attributes.position;
      for (let i = 0; i < emberCount; i++) {
        const index = i * 3;
        emberAttribute.array[index + 1] += emberLift[i] * dt;
        emberAttribute.array[index] += Math.sin(state.time + i) * dt * .035;
        if (emberAttribute.array[index + 1] > 12) {
          emberAttribute.array[index + 1] = 0;
          emberAttribute.array[index] = (Math.random() - .5) * 58;
        }
      }
      emberAttribute.needsUpdate = true;
      for (const flame of lanternLights) flame.light.intensity = 19 + Math.sin(state.time * 5 + flame.phase) * 2 + Math.sin(state.time * 13 + flame.phase) * .8;
      for (const v of villagers) if (v.visible) v.rotation.y = Math.PI + Math.sin(state.time * 1.8 + v.position.x) * .08;
      composer.render();
    }
    animate();
    window.__chivalryReady = true;
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
      composer.setSize(innerWidth, innerHeight); composer.setPixelRatio(devicePixelRatio);
    });
  </script>
</body>
</html>
